name: pytest

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verification-scope:
    runs-on: ubuntu-latest
    outputs:
      harness_only: ${{ steps.scope.outputs.harness_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: Select proportionate changed-head checks
        shell: python
        run: |
          import os, subprocess
          baseline = '06156242a4017f5e5afc668c3c01430252e6fc1d'
          # This fixed source receipt has successful 2987-pass Linux/Windows
          # suites. The earlier workstation2759 receipt remains separate. Any change
          # outside this exact harness/docs allowlist still runs full suites.
          allowed = {
              '.github/workflows/pytest.yml',
              'scripts/certification/verify_natural_readonly_offline.ps1',
              'scripts/certification/invoke_natural_readonly_offline.ps1',
              'scripts/certification/Invoke-LoggedNativeProcess.ps1',
              'tests/powershell/test_offline_exit_status.ps1',
              'tests/powershell/test_readonly_observation.ps1',
              'tests/powershell/verify_observation_package.py',
              'scripts/certification/Invoke-ReadonlyObservation.ps1',
              'scripts/certification/run_natural_readonly_observation.ps1',
              'scripts/certification/natural_readonly_operator.py',
              'scripts/certification/pr1090_terminal_observation_supervisor.py',
              'tests/powershell/verify_windows_inventory.py',
              'scripts/certification/readonly_cache_sitecustomize.py',
              'scripts/certification/readonly_cache_probe.py',
              'scripts/certification/run_natural_readonly_preflight.ps1',
              'tests/powershell/verify_cache_probe.py',
              'docs/ross/NATURAL_READONLY_CHECKPOINT.md',
              'docs/ross/RECEIPT8_PREFLIGHT_DIAGNOSTIC.md',
              'docs/ross/PR1108_NATURAL_READONLY_ACCEPTANCE.ps1',
          }
          ancestor = subprocess.run(['git','merge-base','--is-ancestor',baseline,'HEAD']).returncode == 0
          paths = set(subprocess.check_output(['git','diff','--name-only',baseline,'HEAD']).decode().splitlines()) if ancestor else set()
          focused = ancestor and bool(paths) and paths <= allowed
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'harness_only={str(focused).lower()}\n')
          print('HARNESS_ONLY=' + str(focused))
          print('Full-suite receipt: actions/runs/39661442363 at ' + baseline)
          print('Changed files: ' + ', '.join(sorted(paths)))

  test:
    needs: verification-scope
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        if: needs.verification-scope.outputs.harness_only != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: needs.verification-scope.outputs.harness_only != 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi

      - name: Run pytest
        if: needs.verification-scope.outputs.harness_only != 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/tests/offline:${{ github.workspace }}
        run: pytest -q
      - name: Harness-only source identity and whitespace checks
        if: needs.verification-scope.outputs.harness_only == 'true'
        run: |
          git diff --check 06156242a4017f5e5afc668c3c01430252e6fc1d HEAD
          git diff --exit-code 06156242a4017f5e5afc668c3c01430252e6fc1d HEAD -- src tests/offline tests/conftest.py requirements.txt
          python -m py_compile scripts/certification/natural_readonly_operator.py scripts/certification/readonly_cache_sitecustomize.py tests/powershell/verify_observation_package.py
          python tests/powershell/verify_cache_probe.py
          python tests/powershell/verify_windows_inventory.py
          python tests/powershell/verify_observation_package.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP/observation-package-linux"
          echo "Production/offline Python source unchanged; full-suite receipts carried forward, not rerun."

  windows-offline:
    needs: verification-scope
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.3"
          cache: "pip"
      - name: Install dependencies
        if: needs.verification-scope.outputs.harness_only != 'true'
        run: python -m pip install -r requirements.txt
      - name: Seed inherited operator order state
        if: needs.verification-scope.outputs.harness_only != 'true'
        run: |
          $state = Join-Path $env:RUNNER_TEMP 'operator-order-state.json'
          '{"last_reserved_order_id":361}' | Set-Content -Encoding ascii $state
          "IBKR_ORDER_ID_STATE_PATH=$state" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Focused final-order diagnostics and PowerShell contract (offline)
        if: needs.verification-scope.outputs.harness_only != 'true'
        shell: powershell
        env:
          PYTHONPATH: ${{ github.workspace }}/tests/offline;${{ github.workspace }}
        run: |
          $focusedRoot = Join-Path $env:RUNNER_TEMP ('ps-status-final-orders-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $focusedRoot | Out-Null
          python -m pytest -q tests/test_quote_sdk_transport_probe.py tests/test_quote_transport_operator.py tests/test_final_order_audit_completion.py *> (Join-Path $focusedRoot 'pytest.log')
          $focusedExit = $LASTEXITCODE
          Get-Content (Join-Path $focusedRoot 'pytest.log')
          if ($focusedExit -ne 0) { exit $focusedExit }
          & .\tests\powershell\verify_quote_transport.ps1 *> (Join-Path $focusedRoot 'powershell.log')
          Get-Content (Join-Path $focusedRoot 'powershell.log')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Controlled Windows news ownership and maintenance regressions
        if: needs.verification-scope.outputs.harness_only != 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/tests/offline;${{ github.workspace }}
        run: python -m pytest -q tests/test_independent_news_maintenance.py
      - name: Native Windows float-cache failure and repaired controls (offline)
        if: needs.verification-scope.outputs.harness_only != 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/tests/offline;${{ github.workspace }}
        run: python -m pytest -q -s tests/test_float_cache_concurrency.py
      - name: Full Windows offline suite (includes all six request-ID cases)
        if: needs.verification-scope.outputs.harness_only != 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/tests/offline;${{ github.workspace }}
        run: python -m pytest -q
      - name: Install controlled-process pytest dependency only
        if: needs.verification-scope.outputs.harness_only == 'true'
        run: python -m pip install pytest "yfinance>=0.2.54"
      - name: Offline cache startup diagnostic fixtures
        run: python tests/powershell/verify_cache_probe.py
      - name: Actual Windows PowerShell exit propagation regression
        shell: powershell
        run: |
          & .\tests\powershell\test_offline_exit_status.ps1 -Python (Get-Command python.exe).Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual Windows PowerShell observation harness (stub children only)
        shell: powershell
        run: |
          & .\tests\powershell\test_readonly_observation.ps1 -Python (Get-Command python.exe).Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows PowerShell5.1 quote diagnostic parser (no acquisition)
        shell: powershell
        run: .\tests\powershell\verify_quote_transport.ps1
      - name: Upload controlled harness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-powershell-status-evidence
          path: |
            ${{ runner.temp }}/ps-status-*/
            ${{ runner.temp }}/ps-observation-*/
          if-no-files-found: error
