name: pytest

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi

      - name: Run pytest
        env:
          PYTHONPATH: ${{ github.workspace }}/tests/offline:${{ github.workspace }}
        run: pytest -q

  windows-offline:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.3"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Windows collection and offline socketpair regressions
        env:
          PYTHONPATH: ${{ github.workspace }}/tests/offline;${{ github.workspace }}
        run: python -m pytest -q tests/test_offline_socketpair_guard.py tests/test_execution_mode_engine.py tests/test_pr1091_console_reporting.py
