name: pytest

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verification-scope:
    runs-on: ubuntu-latest
    outputs:
      harness_only: ${{ steps.scope.outputs.harness_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: Select proportionate changed-head checks
        shell: python
        run: |
          import os, subprocess
          baseline = 'ee44dd2ebe51dedf500f54f7c23618a6ad51c91c'
          # This fixed source receipt has successful 2779-pass Linux/Windows
          # suites. The earlier workstation2759 receipt remains separate. Any change
          # outside this exact harness/docs allowlist still runs full suites.
          allowed = {
              '.github/workflows/pytest.yml',
              'scripts/certification/verify_natural_readonly_offline.ps1',
              'scripts/certification/invoke_natural_readonly_offline.ps1',
              'scripts/certification/Invoke-LoggedNativeProcess.ps1',
              'tests/powershell/test_offline_exit_status.ps1',
              'docs/ross/NATURAL_READONLY_CHECKPOINT.md',
              'docs/ross/PR1108_NATURAL_READONLY_ACCEPTANCE.ps1',
          }
          ancestor = subprocess.run(['git','merge-base','--is-ancestor',baseline,'HEAD']).returncode == 0
          paths = set(subprocess.check_output(['git','diff','--name-only',baseline,'HEAD']).decode().splitlines()) if ancestor else set()
          focused = ancestor and bool(paths) and paths <= allowed
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'harness_only={str(focused).lower()}\n')
          print('HARNESS_ONLY=' + str(focused))
          print('Full-suite receipt: actions/runs/38824692588 at ' + baseline)
          print('Changed files: ' + ', '.join(sorted(paths)))

  test:
    needs: verification-scope
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        if: needs.verification-scope.outputs.harness_only != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: needs.verification-scope.outputs.harness_only != 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi

      - name: Run pytest
        if: needs.verification-scope.outputs.harness_only != 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/tests/offline:${{ github.workspace }}
        run: pytest -q
      - name: Harness-only source identity and whitespace checks
        if: needs.verification-scope.outputs.harness_only == 'true'
        run: |
          git diff --check ee44dd2ebe51dedf500f54f7c23618a6ad51c91c HEAD
          git diff --exit-code ee44dd2ebe51dedf500f54f7c23618a6ad51c91c HEAD -- src tests/offline tests/conftest.py requirements.txt
          echo "Production/offline Python source unchanged; full-suite receipts carried forward, not rerun."

  windows-offline:
    needs: verification-scope
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.3"
          cache: "pip"
      - name: Install dependencies
        if: needs.verification-scope.outputs.harness_only != 'true'
        run: python -m pip install -r requirements.txt
      - name: Seed inherited operator order state
        if: needs.verification-scope.outputs.harness_only != 'true'
        run: |
          $state = Join-Path $env:RUNNER_TEMP 'operator-order-state.json'
          '{"last_reserved_order_id":361}' | Set-Content -Encoding ascii $state
          "IBKR_ORDER_ID_STATE_PATH=$state" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Full Windows offline suite (includes all six request-ID cases)
        if: needs.verification-scope.outputs.harness_only != 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/tests/offline;${{ github.workspace }}
        run: python -m pytest -q
      - name: Install controlled-process pytest dependency only
        if: needs.verification-scope.outputs.harness_only == 'true'
        run: python -m pip install pytest
      - name: Actual Windows PowerShell exit propagation regression
        if: needs.verification-scope.outputs.harness_only == 'true'
        shell: powershell
        run: |
          & .\tests\powershell\test_offline_exit_status.ps1 -Python (Get-Command python.exe).Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload controlled harness evidence
        if: always() && needs.verification-scope.outputs.harness_only == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-powershell-status-evidence
          path: ${{ runner.temp }}/ps-status-*/
          if-no-files-found: error
